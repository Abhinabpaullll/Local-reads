<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List a Book | LocalReads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📘 List a Book</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="discover.html">Discover Books</a> |
      <a href="list-book.html">List a Book</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>📚 Share a Book with Your Local Community</h2>
      <form>
        <label>Book Title:</label><br>
        <input type="text" placeholder="e.g., Atomic Habits"><br><br>

        <label>Author:</label><br>
        <input type="text" placeholder="e.g., James Clear"><br><br>

        <label>Genre:</label><br>
        <input type="text" placeholder="e.g., Self-help"><br><br>

        <label>Condition:</label><br>
        <select>
          <option>Like New</option>
          <option>Good</option>
          <option>Fair</option>
          <option>Old but Usable</option>
        </select><br><br>

        <label>Price (or write 0 for exchange):</label><br>
        <input type="number" placeholder="e.g., 100"><br><br>

        <label>Your PIN Code:</label><br>
        <input type="text" placeholder="e.g., 160036"><br><br>

        <button type="submit">📤 Submit Book</button>
      </form>
    </section>
  </main>
</body>
</html>
