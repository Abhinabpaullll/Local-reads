<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discover Books | LocalReads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📖 Discover Books Near You</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="discover.html">Discover Books</a> |
      <a href="list-book.html">List a Book</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>📚 Find Books in Your Area</h2>

      <label for="searchPin">Enter Your PIN Code:</label>
      <input type="text" id="searchPin" placeholder="e.g., 160036">
      <button onclick="filterBooks()">Search</button>

      <div id="results" style="margin-top: 20px;"></div>
    </section>
  </main>

  <script>
    function filterBooks() {
      const pin = document.getElementById("searchPin").value.trim();
      const books = JSON.parse(localStorage.getItem("books")) || [];

      const filtered = books.filter(book => book.pincode === pin);
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (filtered.length === 0) {
        resultsDiv.innerHTML = "<p>❌ No books found for this PIN.</p>";
        return;
      }

      filtered.forEach(book => {
        const card = document.createElement("div");
        card.classList.add("book-card");
        card.innerHTML = `
          <h3>${book.title}</h3>
          <p><strong>Author:</strong> ${book.author}</p>
          <p><strong>Genre:</strong> ${book.genre}</p>
          <p><strong>Condition:</strong> ${book.condition}</p>
          <p><strong>Price:</strong> ₹${book.price}</p>
          <p><strong>PIN Code:</strong> ${book.pincode}</p>
        `;
        resultsDiv.appendChild(card);
      });
    }
  </script>
</body>
</html>
