<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List a Book | LocalReads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📘 List a Book</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="discover.html">Discover Books</a> |
      <a href="list-book.html">List a Book</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>📚 Share a Book with Your Local Community</h2>
      <form id="bookForm">
        <label for="title">Book Title:</label><br>
        <input type="text" id="title" placeholder="e.g., Atomic Habits" required><br><br>

        <label for="author">Author:</label><br>
        <input type="text" id="author" placeholder="e.g., James Clear" required><br><br>

        <label for="genre">Genre:</label><br>
        <input type="text" id="genre" placeholder="e.g., Self-help" required><br><br>

        <label for="condition">Condition:</label><br>
        <select id="condition" required>
          <option value="">Select condition</option>
          <option>Like New</option>
          <option>Good</option>
          <option>Fair</option>
          <option>Old but Usable</option>
        </select><br><br>

        <label for="price">Price (or write 0 for exchange):</label><br>
        <input type="number" id="price" placeholder="e.g., 100" required><br><br>

        <label for="pincode">Your PIN Code:</label><br>
        <input type="text" id="pincode" placeholder="e.g., 160036" required><br><br>

        <button type="submit">📤 Submit Book</button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById("bookForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        genre: document.getElementById("genre").value,
        condition: document.getElementById("condition").value,
        price: document.getElementById("price").value,
        pincode: document.getElementById("pincode").value
      };

      let books = JSON.parse(localStorage.getItem("books")) || [];
      books.push(book);
      localStorage.setItem("books", JSON.stringify(books));

      alert("✅ Book listed successfully!");
      this.reset();
    });
  </script>
</body>
</html>
